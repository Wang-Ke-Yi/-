function showGroup(g,start){wheel.innerHTML='';const sorted=[...g.words].sort((a,b)=>a.localeCompare(b));const idx=sorted.indexOf(g.target);sorted.forEach((w,i)=>{const el=document.createElement('div');el.className='word'+(w===g.target?' target':'');el.textContent=w;wheel.appendChild(el)});const offset=270-(idx*78+39);tl.set('.words',{y:offset},start).from('.words',{y:offset-420,opacity:0,duration:1.25,ease:'power3.out'},start).to('.words',{y:offset,duration:.8,ease:'power3.out'},start+1.25);tl.set('.noun',{textContent:g.noun,opacity:0,x:90},start+2.05).to('.noun',{x:0,opacity:1,duration:.55,ease:'power3.out'},start+2.08)}

tl.to('.wheel',{opacity:0,duration:.45,ease:'power2.in'},9.8).to('.noun',{opacity:0,x:40,duration:.35,ease:'power2.in'},9.8).to('.kicker',{opacity:0,duration:.3},9.8).to('.brand',{opacity:0,duration:.3},9.8).to('.final',{opacity:1,duration:.65,ease:'power2.out'},10.0).from('.final .big',{y:20,opacity:0,duration:.5,ease:'power3.out'},10.12).from('.final .line',{scaleX:0,opacity:0,duration:.45,ease:'power2.out'},10.35);tl.from('.kicker',{opacity:0,y:-12,duration:.4},.1).from('.brand',{opacity:0,y:12,duration:.4},.2);window.__timelines.ending=tl;
